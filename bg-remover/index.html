<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#7c3aed">
  <meta name="description" content="사진의 배경을 지워 투명 PNG로 저장하는 앱. 사진은 기기 밖으로 나가지 않아요.">
  <title>배경 지우개</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app" id="app" data-state="empty">
    <!-- ===== 시작 화면 ===== -->
    <section class="start" id="start">
      <div class="brand">
        <img src="icons/icon.svg" alt="" width="56" height="56">
        <h1>배경 지우개</h1>
        <p class="sub">사진을 고르면 AI가 배경을 지워 줘요</p>
      </div>

      <label class="drop" id="drop" for="file">
        <span class="drop-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="36" height="36"><path fill="currentColor" d="M19 7v2.99s-1.99.01-2 0V7h-3s.01-1.99 0-2h3V2h2v3h3v2h-3zm-3 4V8h-3V5H5c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2v-8h-3zM5 19l3-4 2 3 3-4 4 5H5z"/></svg>
        </span>
        <span class="drop-title">사진 고르기</span>
        <span class="drop-hint" id="dropHint">여기로 끌어다 놓거나 붙여넣기(Ctrl+V)도 돼요</span>
      </label>
      <input type="file" id="file" accept="image/*" hidden>

      <fieldset class="field">
        <legend class="label">무엇을 남길까요?</legend>
        <div class="seg" role="radiogroup" id="modelSeg">
          <label><input type="radio" name="model" value="general" checked><span><b>모든 사물</b><small>추천 · 사람·동물·물건 · 44MB</small></span></label>
          <label><input type="radio" name="model" value="portrait"><span><b>사람만</b><small>가볍고 빠름 · 7MB</small></span></label>
        </div>
        <p class="note">모델은 처음 한 번만 받고 그다음부터는 바로 시작해요. 사진은 이 기기 안에서만 처리되고 서버로 보내지 않아요.</p>
      </fieldset>
    </section>

    <!-- ===== 편집 화면 ===== -->
    <section class="editor" id="editor">
      <div class="stage-wrap">
        <div class="stage" id="stage" data-bg="transparent">
          <canvas id="view"></canvas>
          <div class="cursor" id="cursor" hidden></div>
          <div class="busy" id="busy" hidden>
            <div class="busy-card">
              <div class="spinner" aria-hidden="true"></div>
              <p id="busyText">배경을 찾는 중…</p>
              <div class="bar" id="bar" hidden><i id="barFill"></i></div>
              <p class="busy-sub" id="busySub"></p>
            </div>
          </div>
          <button class="peek" id="peek" type="button" title="누르고 있으면 원본을 보여줘요">원본</button>
          <button class="fit" id="fit" type="button" title="화면에 맞추기" hidden>맞추기</button>
        </div>
      </div>

      <div class="panel">
        <div class="field">
          <span class="label">인식 모델</span>
          <div class="seg compact" role="radiogroup" id="modelSeg2">
            <label><input type="radio" name="model2" value="general" checked><span><b>모든 사물</b></span></label>
            <label><input type="radio" name="model2" value="portrait"><span><b>사람만</b></span></label>
          </div>
        </div>

        <div class="field">
          <span class="label">손으로 다듬기</span>
          <div class="tools" role="radiogroup" id="tools">
            <label><input type="radio" name="tool" value="move" checked><span>✋ 이동</span></label>
            <label><input type="radio" name="tool" value="erase"><span>지우기</span></label>
            <label><input type="radio" name="tool" value="restore"><span>되살리기</span></label>
          </div>
          <div class="brush-row" id="brushRow">
            <label for="brush">붓 크기</label>
            <input type="range" id="brush" min="4" max="200" value="40">
            <output id="brushOut">40</output>
          </div>
          <div class="brush-row" id="softRow">
            <label for="soft">부드럽게</label>
            <input type="range" id="soft" min="0" max="100" value="50">
            <output id="softOut">50</output>
          </div>
          <div class="row-btns">
            <button type="button" class="btn ghost" id="undo" disabled>↶ 되돌리기</button>
            <button type="button" class="btn ghost" id="redo" disabled>↷ 다시</button>
            <button type="button" class="btn ghost" id="reset" disabled>처음 결과로</button>
          </div>
          <p class="note" id="touchHint">두 손가락으로 확대하거나 옮길 수 있어요.</p>
        </div>

        <div class="field">
          <span class="label">배경</span>
          <div class="swatches" id="bgSwatches">
            <button type="button" class="sw sw-clear" data-bg="transparent" aria-pressed="true" title="투명"></button>
            <button type="button" class="sw" data-bg="#ffffff" style="--c:#ffffff" title="흰색"></button>
            <button type="button" class="sw" data-bg="#000000" style="--c:#000000" title="검정"></button>
            <button type="button" class="sw" data-bg="#f3e8d6" style="--c:#f3e8d6" title="베이지"></button>
            <button type="button" class="sw" data-bg="#2563eb" style="--c:#2563eb" title="파랑"></button>
            <button type="button" class="sw" data-bg="#ef4444" style="--c:#ef4444" title="빨강"></button>
            <label class="sw sw-pick" title="색 고르기"><input type="color" id="bgColor" value="#a7f3d0"></label>
            <button type="button" class="sw sw-text" data-bg="blur" title="원본 흐리게">흐림</button>
            <label class="sw sw-text" title="다른 사진을 배경으로">사진<input type="file" id="bgFile" accept="image/*" hidden></label>
          </div>
        </div>

        <div class="field">
          <span class="label">저장 설정</span>
          <label class="check"><input type="checkbox" id="trim"> 피사체에 딱 맞게 자르기</label>
          <label class="check"><input type="checkbox" id="shadow"> 그림자 넣기</label>
        </div>

        <p class="note" id="info"></p>
      </div>
    </section>
  </main>

  <nav class="bottombar" id="bottombar">
    <button type="button" class="btn ghost" id="again">새 사진</button>
    <button type="button" class="btn ghost" id="share" hidden>공유</button>
    <button type="button" class="btn primary" id="save" disabled>저장</button>
  </nav>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="app.js" type="module"></script>
</body>
</html>
